# -----------------------------------------------------------------------------
# Orquestração (Apache Airflow 2.10) do pipeline FarmaData
#
# Arquivo de OVERRIDE: usado junto com o docker-compose.yml principal.
#
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d --build db airflow
#
# UI em http://localhost:8080 (usuário/senha de desenvolvimento: admin / admin).
# DAG em airflow/dags/farmadata_pipeline.py; ver docs/orchestration/README.md.
# -----------------------------------------------------------------------------
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@farmadata_airflow_metadb:5432/airflow
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
  FARMADATA_DIR: /opt/farmadata
  # Banco que o pipeline grava. Para a demonstração com fixtures use o banco de
  # testes criado por airflow/preparar_banco_demo.sh (ver docs/orchestration).
  FARMADATA_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@farmadata_db:5432/${FARMADATA_DB:-${POSTGRES_DB:-farmadata}}
  # Vazio = baixa da Anvisa para tmp/. Para a demonstração com fixtures, use
  # /opt/farmadata/scripts/fixtures/orquestracao (num banco de testes, não no farmadata real).
  FARMADATA_SNGPC_DIR: ${FARMADATA_SNGPC_DIR:-}

services:
  # Metadados do Airflow ficam num Postgres separado do banco analítico.
  airflow-metadb:
    image: postgres:16-alpine
    container_name: farmadata_airflow_metadb
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: farmadata_airflow
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airflow-metadb:
        condition: service_healthy
    environment:
      <<: *airflow-env
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - .:/opt/farmadata
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
               airflow users create -u admin -p admin -r Admin -f Farma -l Data -e admin@farmadata.local || true;
               airflow scheduler & exec airflow webserver -p 8080"

volumes:
  airflow_metadb:
  airflow_logs:
